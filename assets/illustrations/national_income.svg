<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 290" role="img"><rect width="730" height="290" rx="18" fill="#f7f9fd"/><g font-family="Arial,sans-serif" fill="#233555"><text x="365" y="45" font-weight="bold" font-size="22" text-anchor="middle">One economy, three measurement approaches</text><rect x="30" y="92" width="210" height="125" rx="15" fill="#e9efff"/><text x="135" y="132" text-anchor="middle" font-size="17" font-weight="bold">Production</text><text x="135" y="160" text-anchor="middle" font-size="13">Sum value added</text><text x="135" y="182" text-anchor="middle" font-size="13">Avoid double counting</text><path d="M242 153 h15" stroke="#7385a0" stroke-width="3"/><path d="M252 148 l6 5 -6 5" fill="none" stroke="#7385a0" stroke-width="2"/><rect x="260" y="92" width="210" height="125" rx="15" fill="#e5f7f3"/><text x="365" y="132" text-anchor="middle" font-size="17" font-weight="bold">Income</text><text x="365" y="160" text-anchor="middle" font-size="13">Wages, rent, interest</text><text x="365" y="182" text-anchor="middle" font-size="13">and profit</text><path d="M472 153 h15" stroke="#7385a0" stroke-width="3"/><path d="M482 148 l6 5 -6 5" fill="none" stroke="#7385a0" stroke-width="2"/><rect x="490" y="92" width="210" height="125" rx="15" fill="#fff4e2"/><text x="595" y="132" text-anchor="middle" font-size="17" font-weight="bold">Expenditure</text><text x="595" y="160" text-anchor="middle" font-size="13">C + I + G + (X − M)</text><text x="595" y="182" text-anchor="middle" font-size="13">Final expenditure</text><text x="365" y="260" font-size="14" text-anchor="middle">Comparable totals require the same aggregate and accounting period.</text></g></svg>